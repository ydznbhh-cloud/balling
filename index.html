</style><section id="lobby" class="lobby"><h1>弹球竞技场</h1><p>选择两位选手，看看谁能率先突破八层障碍</p><div class="pickers"><section><h2>左侧选手</h2><div id="left-roster" class="roster"></div></section><section><h2>右侧选手</h2><div id="right-roster" class="roster"></div></section></div><button id="launch" class="launch">开始对战</button><button id="dev-open">⚙ 开发者模式</button><section id="developer" hidden><h2>开发者参数</h2><p>修改后点击保存，下一局生效。概率单位为 %，时长单位为游戏秒，倍速会加速游戏时间。</p><form id="dev-form"><div id="dev-fields"></div><div class="dev-actions"><button type="submit">保存参数</button><button type="button" id="dev-default">恢复默认</button><button type="button" id="dev-export">导出配置</button><label>导入配置<input id="dev-import" type="file" accept=".json,application/json" hidden></label></div></form><p id="dev-message" role="status"></p></section></section><main hidden><h1>HEAVY <span style="color:#a59aaf">vs</span> <span style="color:#9df5ad">√ 根号球</span></h1><p>重量不断增长，还是开方化解一切？</p><canvas id="game" width="660" height="1185" aria-label="双赛道弹球破板比赛"></canvas><div class="controls"><button id="start">开始比赛</button><button id="reset">重新开始</button><button id="back">主菜单</button><select id="speed" aria-label="播放速度"><option value="0.1">0.1× 速度</option><option value="0.5">0.5× 速度</option><option value="0.75">0.75× 速度</option><option value="1" selected>1× 速度</option><option value="2">2× 速度</option><option value="4">4× 速度</option></select></div></main><div id="result" class="result" role="dialog" aria-modal="true" aria-labelledby="result-title" hidden><div class="result-card"><div class="confetti" aria-hidden="true"></div><span class="medal" aria-hidden="true">🏆</span><h2 id="result-title"></h2><p id="result-detail"></p><button id="again">重新开始</button><button id="menu" type="button">返回主菜单</button></div></div><script src="developer.js"></script><script src="expansion.js"></script><script>

function hitBoard(b){if(newRoles.some(r=>r.id===b.role))return newHit(b);let hp=b.hp[b.index];if(b.role==='heavy'){let damage=b.rageTime>0?Math.max(b.power+Math.log10(cfg.rageMultiplier),cfg.ragePercent>0?levels[b.index]+Math.log10(cfg.ragePercent/100):-Infinity):b.power;let broken=damage>=hp-1e-10;if(!broken)b.hp[b.index]=hp+Math.log10(1-10**(damage-hp));b.power+=Math.log10(cfg.growth);return broken}if(Math.round(10**hp)<=1)return true;if(b.role==='drill'){if(Math.random()<cfg.drillChance/100){b.ultimate=true;return true}b.charge++;if(b.charge>=cfg.drillHits)return true;b.hp[b.index]=levels[b.index]+Math.log10(1-b.charge/cfg.drillHits);return false}if(b.role==='root')hp/=cfg.rootDegree;if(b.role==='cube')hp/=cfg.cubeDegree;if(b.role==='ln')hp=Math.log10(Math.max(1,hp*Math.LN10/Math.log(cfg.lnBase)));if(b.role==='chaos'){let degree=cfg.chaosMin+Math.random()*(cfg.chaosMax-cfg.chaosMin);hp/=degree;b.rootFlash={age:0,degrees:[degree]};if(Math.random()<cfg.chaosChance/100){let extra=cfg.chaosMin+Math.random()*(cfg.chaosMax-cfg.chaosMin);hp/=extra;b.rootFlash.degrees.push(extra)}}b.hp[b.index]=hp;return false}

let impacts=[],explosions=[];
let lanes,running=false,time=0,particles=[],last=0,winner=null;

function fmt(log){if(log<0.00001)return '1';if(log<5)return Math.round(10**log).toLocaleString('en-US');let e=Math.floor(log);return (10**(log-e)).toFixed(2)+'×10'+sup(e)}
function sup(n){return String(n).split('').map(c=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+c]).join('')}
function burst(x,y,color){for(let i=0;i<Math.round(25*cfg.particles);i++)particles.push({x,y,vx:(Math.random()-.5)*300,vy:-Math.random()*240,life:1,color})}
function resolveHit(b,i,floor){b.hits++;if(b.role==='heavy'&&b.rageTime<=0){b.rage+=cfg.rageGain;if(b.rage>=cfg.rageMax){b.rage=0;b.rageTime=cfg.rageDuration;burst(b.x,b.y,'#ff6b39')}}let previous=b.hp[b.index];let broken=hitBoard(b);recordDamage(b,previous,broken&&b.role!=='lead'?null:b.hp[b.index]);if(!broken)loadFracture(b,i,previous);if(b.role!=='spring')impact(b.role==='lead'?b.special.contactX??b.x:b.x,b.role==='lead'?b.special.contactY??floor:floor,b.rageTime>0?'#ff6b39':colors[b.index],i,broken&&b.role!=='lead');if(b.ultimate){explode(b.x,floor,i);b.ultimate=false}if(broken){if(b.role!=='spring'&&b.role!=='lead')burst(b.x,floor,colors[b.index]);b.index++;b.charge=0;b.v=cfg.fall+Math.random()*cfg.fallRandom}else b.v=-(b.role==='heavy'&&b.rageTime>0?cfg.rageBounce+Math.random()*cfg.rageRandom:b.role==='drill'?cfg.drillBounce+Math.random()*cfg.drillRandom:(b.role==='root'?cfg.rootBounce:cfg.bounce*(b.role==='cube'?cfg.cubeBounce:1))+Math.random()*cfg.bounceRandom);afterNewHit(b,broken);if(b.role==='lead')return;b.vx=Math.max(-cfg.vxMax,Math.min(cfg.vxMax,b.vx+(Math.random()-.5)*cfg.vxJitter));if(Math.abs(b.vx)<cfg.vxFloor)b.vx=(b.vx<0?-1:1)*cfg.vxFloor;}
function update(dt){if(winner!==null)return;time+=dt;explosions.forEach(e=>e.age+=dt);explosions=explosions.filter(e=>e.age<1);lanes.forEach(b=>b.fractures.forEach(f=>f.edges.forEach(e=>e.reveal=Math.min(1,e.reveal+dt*cfg.crackReveal))));impacts.forEach(p=>p.age+=dt);impacts=impacts.filter(p=>p.age<.5);lanes.forEach((b,i)=>{if(b.done||winner!==null)return;b.damageTexts.forEach(d=>d.age+=dt);b.damageTexts=b.damageTexts.filter(d=>d.age<.9);if(b.damagePending){b.damagePending.age+=dt;if(b.damagePending.age>=.25){recordDamage(b,b.damagePending.before,b.hp[b.index]);b.damagePending=null}}if(tickNew(b,i,dt))return;if(b.rootFlash){b.rootFlash.age+=dt;if(b.rootFlash.age>=.85)b.rootFlash=null}b.rageTime=Math.max(0,b.rageTime-dt);if(b.action){b.action.elapsed+=dt;if(b.role==='drill'){b.action.crackClock=(b.action.crackClock||0)+dt;while(b.action.crackClock>=cfg.crackInterval){b.action.crackClock-=cfg.crackInterval;loadFracture(b,i,b.hp[b.index],true)}}if(b.action.elapsed>=b.action.duration){let floor=b.action.floor;b.action=null;resolveHit(b,i,floor)}return}let step=dt*(b.role==='cube'?cfg.cubeSpeed:1)*(b.role==='spring'&&b.special.boost>0?cfg.springComboSpeed:1);b.x+=b.vx*step;const left=i?380:68,right=i?592:280;if(b.x<left){b.x=left;b.vx=Math.abs(b.vx);wallNew(b)}else if(b.x>right){b.x=right;b.vx=-Math.abs(b.vx);wallNew(b)}b.v+=cfg.gravity*step;b.y+=b.v*step;let floor=b.index<8?258+b.index*113.2:1140;if(b.role==='lead'&&b.index<8){let local=b.x-(i?348:36),dents=b.special.boards[b.index].dents;let support=Infinity,contact=local;for(let k=Math.max(0,Math.ceil((local-32)/2));k<=Math.min(138,Math.floor((local+32)/2));k++){if(dents[k]>=30)continue;let dx=k*2-local;let candidate=dents[k]-Math.sqrt(Math.max(0,32*32-dx*dx));if(candidate<support){support=candidate;contact=k*2}}if(Number.isFinite(support)){floor+=support+32;b.special.contactX=contact+(i?348:36);b.special.contactY=258+b.index*113.2+dents[Math.round(contact/2)]}else{b.special.contactX=b.x;b.special.contactY=floor+30;b.index++;return}}if(b.y+32>=floor&&b.v>0){b.y=floor-32;if(b.index===8){b.done=true;b.finish=time;finishRace(i);return}if(beginNewContact(b,i,floor))return;if(b.role==='cube'||b.role==='drill'){b.action={elapsed:0,duration:b.role==='cube'?cfg.cubeWait:cfg.drillDuration,floor,angle:Math.atan2(b.v,b.vx)};impact(b.x,floor,colors[b.index],i,false);return}resolveHit(b,i,floor)}});particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt;p.life-=dt});particles=particles.filter(p=>p.life>0)}

// Persistent crack graph: accumulated contact loads drive crack tips through a seeded material field.
function fractureRandom(f){f.seed=(Math.imul(f.seed,1664525)+1013904223)>>>0;return f.seed/4294967296}
function segmentMeet(a,b,c,d){let ux=b.x-a.x,uy=b.y-a.y,vx=d.x-c.x,vy=d.y-c.y,den=ux*vy-uy*vx;if(Math.abs(den)<1e-8)return null;let dx=c.x-a.x,dy=c.y-a.y,t=(dx*vy-dy*vx)/den,u=(dx*uy-dy*ux)/den;return t>.025&&t<=1&&u>=0&&u<=1?{x:a.x+t*ux,y:a.y+t*uy,t}:null}
function loadFracture(b,side,previous,drilling=false){let f=b.fractures[b.index],x=b.x-(side?348:36),damage=Math.max(0,Math.min(1,1-b.hp[b.index]/levels[b.index]));let energy=drilling?cfg.crackEnergy:10+Math.min(16,Math.max(0,previous-b.hp[b.index])/levels[b.index]*30);f.loads.push({x,energy});if(f.loads.length>32)f.loads.shift();let near=f.nodes.reduce((best,n,i)=>Math.hypot(n.x-x,n.y)<best.distance?{distance:Math.hypot(n.x-x,n.y),i}:best,{distance:13,i:-1});if(near.i<0&&f.nodes.length<200){let root=f.nodes.push({x,y:1})-1;for(let k=0;k<3;k++)f.tips.push({node:root,angle:.4+k*1.15+(fractureRandom(f)-.5)*.25,energy:energy*.7,depth:0})}else if(near.i>=0){for(const tip of f.tips){let n=f.nodes[tip.node];tip.energy+=energy*Math.exp(-Math.hypot(n.x-x,n.y)/38)}}

f.edges.forEach(e=>{let n=f.nodes[e.to];e.width=Math.min(2.5,e.width+.12*Math.exp(-Math.hypot(n.x-x,n.y)/30))});
for(let iteration=0;iteration<(drilling?1:7)&&f.edges.length<cfg.crackLimit;iteration++){let tips=[...f.tips];for(const tip of tips){if(tip.stopped||tip.energy<2)continue;let n=f.nodes[tip.node];let stress=f.loads.reduce((sum,l)=>sum+l.energy*Math.exp(-Math.hypot(n.x-l.x,n.y)/44),0);let step=Math.min(5,tip.energy*.4);let best=null;for(let k=-2;k<=2;k++){let angle=tip.angle+k*.18+(fractureRandom(f)-.5)*.12;let q={x:Math.max(1,Math.min(275,n.x+Math.cos(angle)*step)),y:Math.max(1,Math.min(29,n.y+Math.sin(angle)*step))};let field=Math.sin(q.x*.19+q.y*.43)*.4+Math.sin(q.x*.071-q.y*.62)*.3;let score=stress*.05+field-Math.abs(k)*.14;if(!best||score>best.score)best={...q,angle,score}}if(Math.hypot(best.x-n.x,best.y-n.y)<.7){tip.stopped=true;continue}let meet=null,hitEdge=null;for(const e of f.edges){if(e.from===tip.node||e.to===tip.node)continue;let hit=segmentMeet(n,best,f.nodes[e.from],f.nodes[e.to]);if(hit&&(!meet||hit.t<meet.t)){meet=hit;hitEdge=e}}let end=meet||best;let id=f.nodes.push({x:end.x,y:end.y})-1;f.edges.push({from:tip.node,to:id,width:.7+damage*.5,reveal:0});if(meet){let oldTo=hitEdge.to;hitEdge.to=id;f.edges.push({from:id,to:oldTo,width:hitEdge.width,reveal:1});tip.stopped=true}else{tip.node=id;tip.angle=best.angle;tip.energy-=1.6;if(best.y>=28.9||best.x<=1||best.x>=275)tip.stopped=true;if(tip.energy>7&&tip.depth<2&&f.tips.length<28&&fractureRandom(f)<cfg.crackBranch/100){let split=tip.energy*.35;tip.energy-=split;f.tips.push({node:id,angle:tip.angle+(fractureRandom(f)<.5?-1:1)*.65,energy:split,depth:tip.depth+1})}}}}f.tips=f.tips.filter(t=>!t.stopped);}
function drawDamage(b,j,x,y){let f=b.fractures[j];if(!f.edges.length)return;ctx.save();ctx.beginPath();ctx.roundRect(x+1,y+1,274,28,4);ctx.clip();for(const e of f.edges){let a=f.nodes[e.from],z=f.nodes[e.to],t=e.reveal;ctx.beginPath();ctx.moveTo(x+a.x,y+a.y);ctx.lineTo(x+a.x+(z.x-a.x)*t,y+a.y+(z.y-a.y)*t);ctx.strokeStyle='#30202bc9';ctx.lineWidth=e.width;ctx.stroke();ctx.translate(.7,0);ctx.strokeStyle='#ffffff40';ctx.lineWidth=.55;ctx.stroke();ctx.translate(-.7,0)}ctx.restore();}
function drawRage(b){if(b.role!=='heavy')return;ctx.save();if(b.rageTime>0){ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffc385';ctx.fillText('狂暴 '+b.rageTime.toFixed(1)+'s',b.x,b.y+61)}round(b.x-33,b.y+40,66,6,3,'#241d29');let fill=b.rageTime>0?b.rageTime/cfg.rageDuration:b.rage/cfg.rageMax;if(fill>0)round(b.x-33,b.y+40,66*fill,6,3,b.rageTime>0?'#ff693a':'#edb350');ctx.restore();}
function recordDamage(b,before,after){let log=after===null?before:before+Math.log10(-Math.expm1((after-before)*Math.LN10));if(!Number.isFinite(log))return;b.damageTexts.push({log,age:0});if(b.damageTexts.length>5)b.damageTexts.shift();}
function drawDamageTexts(b){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 15px system-ui';ctx.fillStyle='#ff6565';ctx.shadowColor='#200b19';ctx.shadowBlur=4;b.damageTexts.forEach((d,i)=>{ctx.globalAlpha=Math.min(1,(.9-d.age)/.3);ctx.fillText('−'+fmt(d.log),b.x,b.y-83-d.age*32-(b.damageTexts.length-1-i)*15)});ctx.restore();}
function drawChaosHint(b){if(!b.rootFlash)return;let t=b.rootFlash.age;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,t/.12,(.85-t)/.3));ctx.font='600 15px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#ffd3f0';ctx.shadowColor='#160d24';ctx.shadowBlur=5;let text=b.rootFlash.degrees.map(n=>Number(n.toFixed(1))).join(' · ');let right=b.x<330?308:620;let width=ctx.measureText(text).width;ctx.fillText(text,Math.min(b.x+25,right-width),b.y-35-Math.min(t,.5)*12);ctx.restore();}
function drawAction(b){if(!b.action||b.action.kind)return;let a=b.action,t=a.elapsed/a.duration;ctx.save();ctx.translate(b.x,b.y);if(b.role==='drill'){ctx.rotate(a.angle-Math.PI/2);ctx.translate(Math.sin(a.elapsed*85)*2,Math.sin(a.elapsed*65)*2);ctx.fillStyle='#f8d296';ctx.strokeStyle='#fff0c9';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-18,18);ctx.lineTo(18,18);ctx.lineTo(0,43);ctx.closePath();ctx.fill();ctx.stroke();for(let j=0;j<5;j++){let y=18+((j*6+a.elapsed*55)%24);let w=(43-y)*.65;ctx.beginPath();ctx.moveTo(-w,y);ctx.lineTo(w,y-4);ctx.stroke()}ctx.strokeStyle='#ffc266';for(let j=0;j<6;j++){let x=Math.sin(j*4+a.elapsed*30)*27,y=35+Math.cos(j*5+a.elapsed*24)*10;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x*1.5,y-12);ctx.stroke()}}else{ctx.strokeStyle='#dbbeff';ctx.lineWidth=3;ctx.shadowColor='#bc87ff';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(0,0,39+Math.sin(t*Math.PI)*5,-Math.PI/2,-Math.PI/2+t*Math.PI*2);ctx.stroke()}ctx.restore();}
function impact(x,y,color,side,broken,emitParticles=true){impacts.push({x,y,color,side,broken,age:0});if(!emitParticles)return;for(let i=0;i<Math.round((broken?24:12)*cfg.particles);i++){let a=Math.PI+Math.random()*Math.PI;let speed=80+Math.random()*(broken?340:200);particles.push({x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:broken?.8:.35,color:broken?color:'#fff4cb'});}}
function drawImpacts(){for(const p of impacts){let t=p.age/.5;ctx.save();ctx.globalAlpha=(1-t)*(p.broken?.9:.65);ctx.strokeStyle=p.broken?p.color:'#fff9d9';ctx.lineWidth=(1-t)*5;ctx.beginPath();ctx.ellipse(p.x,p.y,12+t*(p.broken?120:80),5+t*25,0,0,Math.PI*2);ctx.stroke();if(t<.35){ctx.globalAlpha=(1-t/.35)*.9;ctx.fillStyle='#fffce9';ctx.beginPath();for(let k=0;k<16;k++){let a=k*Math.PI/8;let r=k%2?9:(p.broken?46:30);ctx.lineTo(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r*.65)}ctx.closePath();ctx.fill()}ctx.restore();}}
function round(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,660,1185);ctx.save();let blast=explosions.at(-1);if(blast){let strength=Math.max(0,1-blast.age/.32);ctx.translate(Math.sin(blast.age*143)*strength*9*cfg.shake,Math.cos(blast.age*111)*strength*7*cfg.shake)}round(0,0,660,1185,28,'#304352','#657780');let bg=ctx.createLinearGradient(0,70,0,1155);bg.addColorStop(0,'#170d28');bg.addColorStop(.8,'#590b6e');bg.addColorStop(1,'#b35836');for(let side=0;side<2;side++){let x=side?348:36;ctx.fillStyle=bg;ctx.fillRect(x,76,276,1081);ctx.save();ctx.beginPath();ctx.rect(x,76,276,1081);ctx.clip();if(mountainImage.complete&&mountainImage.naturalWidth){let scale=Math.max(588/mountainImage.naturalWidth,1081/mountainImage.naturalHeight),w=mountainImage.naturalWidth*scale,h=mountainImage.naturalHeight*scale;ctx.drawImage(mountainImage,36+(588-w)/2,76+(1081-h)/2,w,h);ctx.fillStyle='#080e244d';ctx.fillRect(x,76,276,1081)}ctx.restore();for(let r=0;r<3;r++)for(let c=0;c<16;c++){ctx.fillStyle=(r+c)%2?'#14151c':'#eff3e8';ctx.fillRect(x+c*17.25,1140+r*9,17.25,9)}let b=lanes[side];ctx.save();let recent=impacts.findLast(p=>p.side===side);let kick=recent?Math.max(0,1-recent.age/.22):0;ctx.translate(Math.sin((recent?.age||0)*95)*kick*3,Math.sin((recent?.age||0)*70)*kick*5);for(let j=b.role==='lead'?0:b.index;j<8;j++){if(b.special.cleared.includes(j))continue;let y=258+j*113.2;if(b.role==='lead'&&b.special.leadBoard===j&&b.special.leadThud>0){let age=.28-b.special.leadThud;y+=Math.sin(age*65)*7*(b.special.leadThud/.28)}let bend=j===b.index?kick*8:0;y+=bend;ctx.save();if(b.role==='spring'&&b.special.boardShakes[j]>0){let remaining=b.special.boardShakes[j],age=.22-remaining,strength=remaining/.22;ctx.translate(Math.sin(age*115)*4*strength,Math.sin(age*83)*5*strength)}if(j===b.index&&b.role==='drill'&&b.action){let t=b.action.elapsed;ctx.translate(Math.sin(t*105)*3*cfg.drillShake,Math.sin(t*137)*2.5*cfg.drillShake)}if(b.role==='lead'){ctx.beginPath();let material=b.special.boards[j].material;for(let row=0;row<15;row++){let start=-1;for(let col=0;col<=138;col++){let solid=col<138&&material[row*138+col];if(solid&&start<0)start=col;if(!solid&&start>=0){ctx.rect(x+start*2,y+row*2,(col-start)*2,2);start=-1}}}ctx.clip()}round(x,y,276,30,5,colors[j],b.role==='lead'?null:'#e5e5d9');if(bend){ctx.save();ctx.globalAlpha=kick*.65;round(x,y,276,30,5,'#ffffff');ctx.restore();}if(b.role!=='lead'){ctx.fillStyle='#ffffff44';ctx.fillRect(x+4,y+3,268,5);}ctx.fillStyle='#111a22';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(fmt(b.hp[j]),x+138,y+23);drawDamage(b,j,x,y);drawNewBoard(b,j,x,y);ctx.restore()}ctx.save();if(b.role==='spring'){ctx.translate(b.x,b.y);ctx.scale(.5,.5);ctx.translate(-b.x,-b.y)}if(b.role==='spring'&&b.action?.kind==='springGhost')ctx.globalAlpha=.85;if(b.role==='spring'&&b.action?.kind==='spring'){let squash=Math.sin(b.action.elapsed/b.action.duration*Math.PI/2);ctx.translate(b.x,b.y);ctx.scale(1+squash*.2,1-squash*.3);ctx.translate(-b.x,-b.y)}let g=ctx.createRadialGradient(b.x-12,b.y-13,2,b.x,b.y,34);g.addColorStop(0,'#e4edee');g.addColorStop(.5,roleOf(b).color);g.addColorStop(1,'#19242b');ctx.beginPath();ctx.arc(b.x,b.y,32,0,7);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=roleOf(b).color;ctx.lineWidth=3;ctx.stroke();if(b.role==='heavy'&&b.rageTime>0){ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';if(rageImage.complete&&rageImage.naturalWidth)ctx.drawImage(rageImage,b.x-35,b.y-35,70,70);ctx.restore()}if(b.role!=='heavy'){ctx.fillStyle='#f4fff2';ctx.font='bold 32px system-ui';ctx.textAlign='center';ctx.fillText(roleOf(b).icon,b.x,b.y+11);}else{ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';round(b.x-66,b.y-65,132,28,9,'#161c29','#aca3bc');ctx.fillStyle='#eff7fa';ctx.font='bold 18px system-ui';ctx.fillText(fmt(b.power),b.x,b.y-51);ctx.restore()}ctx.restore();drawAction(b);drawRage(b);drawChaosHint(b);drawNewBall(b);drawLeadThud(b);drawDamageTexts(b);ctx.restore()}ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='600 30px "Trebuchet MS", "Segoe UI", sans-serif';ctx.fillStyle=roleOf(lanes[0]).color;ctx.fillText(roleOf(lanes[0]).icon+' '+roleOf(lanes[0]).name,174,38);ctx.font='600 27px "Trebuchet MS", "Segoe UI", sans-serif';ctx.fillStyle='#c3bba9';ctx.fillText('VS',330,38);ctx.font='600 28px "Segoe UI", "Microsoft YaHei", sans-serif';ctx.fillStyle=roleOf(lanes[1]).color;ctx.fillText(roleOf(lanes[1]).icon+' '+roleOf(lanes[1]).name,486,38);ctx.restore();drawImpacts();drawExplosions();particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,6,5)});ctx.globalAlpha=1;ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ede5f3';ctx.font='12px system-ui';ctx.fillText(time.toFixed(1)+' s',330,1176);ctx.restore();ctx.restore()}
function toggle(){if(winner!==null||inMenu)return;running=!running;document.querySelector('#start').textContent=running?'暂停':'继续比赛';if(winner===null)statusText.value=running?'比赛进行中':'已暂停'}
function finishRace(side){winner=side;running=false;document.querySelector('#start').textContent='比赛结束';document.querySelector('#start').disabled=true;document.querySelector('#speed').disabled=true;document.querySelector('#result-title').textContent=roleOf(lanes[side]).name+' 获胜！';document.querySelector('#result-detail').textContent='率先抵达终点 · 用时 '+time.toFixed(1)+' 秒';document.querySelector('.confetti').innerHTML=Array.from({length:26},(_,i)=>'<i style="--x:'+((i*37)%100)+'%;--d:'+(-i*.13)+'s;--c:'+colors[i%8]+'"></i>').join('');document.querySelector('#result').hidden=false;document.querySelector('#again').focus();}
document.querySelector('#menu').onclick=showMenu;document.querySelector('#back').onclick=showMenu;
document.querySelector('#again').onclick=()=>{reset();toggle();document.querySelector('#start').focus()};
document.querySelector('#start').onclick=toggle;document.querySelector('#reset').onclick=reset;document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='SELECT'&&e.target.tagName!=='BUTTON'&&!inMenu){e.preventDefault();toggle()}});function frame(t){let dt=Math.min((t-last)/1000,.05);last=t;if(running){let speed=Number(document.querySelector('#speed').value);let n=Math.max(1,Math.ceil(speed*6));for(let i=0;i<n;i++)update(dt*speed/n)}if(!inMenu)draw();requestAnimationFrame(frame)}reset();renderRoster();initDeveloper();requestAnimationFrame(frame);
</script></html>
